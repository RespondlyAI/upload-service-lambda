org: respondlyai
app: upload-service
service: upload-service-lambda

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 29
  apiGateway:
    restApiId:
      Fn::ImportValue: ${self:provider.stage}-RespondlyAI-RestApiId
    restApiRootResourceId:
      Fn::ImportValue: ${self:provider.stage}-RespondlyAI-RootResourceId
  
  environment:
    NODE_ENV: ${self:provider.stage}
    STAGE: ${self:provider.stage}

functions:
  signedUrl:
    handler: src/handler.signedUrl
    events:
      - http:
          path: /upload/signed-url
          method: post
          cors: true
  uploadComplete:
    handler: src/handler.uploadComplete
    events:
      - http:
          path: /upload/complete
          method: post
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003